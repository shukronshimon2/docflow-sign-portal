name: Appwrite Keep Alive

on:
  schedule:
    # Runs every 2 days at 09:00 UTC
    - cron: '0 9 */2 * *'
  workflow_dispatch: # Allows running manually anytime from GitHub Actions tab

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat Signal to Appwrite Cloud
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://cloud.appwrite.io/v1/databases/6ab90c810000f1f0489f/collections/6ab90e27001a33441957/documents?queries[]=%7B%22method%22%3A%22limit%22%2C%22values%22%3A%5B1%5D%7D" \
            -H "X-Appwrite-Project: 6ab90b66003a2917b8b2")
          echo "Appwrite heartbeat response HTTP status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Successfully pinged Appwrite project to prevent hibernation."
          else
            echo "Unexpected status code: $STATUS"
            exit 1
          fi
